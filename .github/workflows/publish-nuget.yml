name: Publish NuGet

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AminTools.csproj

      - name: Pack NuGet package
        run: dotnet pack AminTools.csproj --configuration Release --no-restore --output ./nupkg

      - name: Add GitHub Packages source
        run: >
          dotnet nuget add source
          --username MintyBueno
          --password "${{ secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text
          --name github
          "https://nuget.pkg.github.com/MintyBueno/index.json"

      - name: Publish NuGet package
        run: >
          dotnet nuget push "./nupkg/*.nupkg"
          --source github
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate